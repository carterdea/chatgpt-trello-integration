name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Verify patched Ruby runtime
        run: |
          ruby -rrubygems <<'RUBY'
          minimums = { "3.3" => "3.3.13", "3.4" => "3.4.12", "4.0" => "4.0.9" }
          series = RUBY_VERSION.split(".").first(2).join(".")
          minimum = minimums[series]
          patched = minimum && Gem::Version.new(RUBY_VERSION) >= Gem::Version.new(minimum)
          abort "Ruby runtime lacks the October 2026 Regexp fixes" unless patched
          RUBY

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Lint code for consistent style
        run: bin/rubocop -f github

